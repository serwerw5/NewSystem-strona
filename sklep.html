<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zamów Miniaturkę</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .form-card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 25px; width: 100%; max-width: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
    h2 { margin-bottom: 8px; text-align: center; color: #38bdf8; }
    p.sub { color: #94a3b8; font-size: 0.9rem; text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-size: 0.85rem; color: #94a3b8; margin-bottom: 6px; }
    input[type="text"], input[type="email"], select, textarea { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; outline: none; font-size: 0.95rem; }
    input[type="file"] { width: 100%; padding: 8px; border-radius: 8px; border: 1px dashed #334155; background: #0f172a; color: #94a3b8; font-size: 0.85rem; cursor: pointer; }
    textarea { resize: vertical; min-height: 100px; }
    button { width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer; transition: background 0.2s; margin-top: 10px; }
    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Formularz Zamówienia</h2>
    <p class="sub">Wypełnij formularz – wiadomość trafi bezpośrednio na mój telefon.</p>

    <!-- Zintegrowany Formspree wysyłający na serwerw45@proton.me -->
    <form action="https://formspree.io/f/serwerw45@proton.me" method="POST" enctype="multipart/form-data">
      
      <div class="form-group">
        <label for="nickname">Twoja nazwa / Nick Discord:</label>
        <input type="text" id="nickname" name="Nick_Klienta" placeholder="np. JanKowalski#1234" required>
      </div>

      <div class="form-group">
        <label for="package">Wybierz pakiet:</label>
        <select id="package" name="Pakiet">
          <option value="1 miniatura (15 zł)">1 miniatura - 15 zł</option>
          <option value="2 miniatury (20 zł)">2 miniatury - 20 zł</option>
          <option value="Niestandardowa ilość">Niestandardowa ilość</option>
        </select>
      </div>

      <div class="form-group">
        <label for="description">Opisz swój pomysł i styl miniatury:</label>
        <textarea id="description" name="Opis_Zamowienia" placeholder="Opisz jak najdokładniej o czym ma być film, jakie napisy umieścić..." required></textarea>
      </div>

      <div class="form-group">
        <label for="file">Dodaj materiały / podgląd (opcjonalnie):</label>
        <input type="file" id="file" name="Zalacznik">
      </div>

      <div class="form-group">
        <label for="contact">Twój e-mail do kontaktu z Tobą:</label>
        <input type="email" id="contact" name="Email_Klienta" placeholder="twoj@email.com" required>
      </div>

      <button type="submit">Wyślij zamówienie</button>
    </form>
  </div>

</body>
</html>
