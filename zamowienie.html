<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zamówienia - Panel Admina</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease; z-index: 10000;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-card { background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 25px; width: 100%; max-width: 320px; position: relative; }
    .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.4rem; color: #94a3b8; cursor: pointer; background: none; border: none; }
    .modal-title { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #94a3b8; }
    .form-group input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #334155; background: #0f172a; color: #f8fafc; outline: none; }
    .btn-submit { width: 100%; background: #3b82f6; color: white; border: none; padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 10px; }

    #admin-panel-view {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0f172a; z-index: 20000; flex-direction: column; color: #f8fafc;
    }
    .admin-nav { height: 60px; background: #1e293b; border-bottom: 1px solid #334155; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
    .admin-nav-tabs { display: flex; gap: 10px; }
    .admin-tab { padding: 8px 16px; background: #334155; border: none; border-radius: 6px; color: white; cursor: pointer; font-weight: 600; }
    .admin-tab.active { background: #3b82f6; }
    
    .admin-content { flex: 1; padding: 20px; overflow-y: auto; }
    
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .stat-card { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; text-align: center; }
    .stat-value { font-size: 1.8rem; font-weight: 700; color: #38bdf8; margin-top: 5px; }
    .chart-container { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 20px; max-width: 900px; margin: 0 auto; }

    .discord-container { display: flex; height: 100%; background: #2f3136; border-radius: 12px; overflow: hidden; }
    .discord-sidebar { width: 260px; background: #2b2d31; border-right: 1px solid #202225; display: flex; flex-direction: column; }
    .discord-sidebar-header { padding: 15px; font-weight: bold; border-bottom: 1px solid #202225; }
    .discord-user-list { flex: 1; overflow-y: auto; }
    .discord-user-item { padding: 12px 15px; cursor: pointer; border-bottom: 1px solid #36393f; transition: background 0.2s; }
    .discord-user-item:hover, .discord-user-item.active { background: #35373c; }
    .discord-username { font-weight: 600; font-size: 0.95rem; color: #ffffff; }
    .discord-package { font-size: 0.75rem; color: #b9bbbe; margin-top: 2px; }
    
    .discord-chat-area { flex: 1; display: flex; flex-direction: column; background: #36393f; }
    .discord-empty { flex: 1; display: flex; align-items: center; justify-content: center; color: #dcddde; font-size: 1.2rem; font-weight: 600; }
    .discord-chat-content { flex: 1; display: none; flex-direction: column; }
    .discord-chat-header { padding: 15px; background: #36393f; border-bottom: 1px solid #2f3136; font-weight: bold; display: flex; justify-content: space-between; align-items: center; }
    .discord-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .discord-input-area { padding: 15px; background: #40444b; display: flex; gap: 10px; align-items: center; }
    .discord-input { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 0.95rem; }

    .btn-action {
      background: #3b82f6; color: white; border: none; width: 42px; height: 42px;
      border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
    }
    .btn-admin-close { background: #eab308; color: black; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 5px; }
    .btn-admin-emergency { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; margin-left: 5px; }

    .login-btn-start {
      padding: 15px 30px; font-size: 1.2rem; font-weight: bold; background: #3b82f6; color: white; border: none; border-radius: 12px; cursor: pointer;
    }
  </style>
</head>
<body>

  <button class="login-btn-start" id="open-admin">Zaloguj jako Admin</button>

  <!-- MODAL ADMINA (KOD) -->
  <div class="modal-overlay" id="admin-modal">
    <div class="modal-card">
      <button class="close-btn" id="close-admin">&times;</button>
      <h2 class="modal-title">Panel Admina</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="admin-code">Kod Admina</label>
          <input type="password" id="admin-code" placeholder="Wpisz kod..." required>
        </div>
        <button type="submit" class="btn-submit">Zaloguj</button>
      </form>
    </div>
  </div>

  <!-- PANEL ADMINA -->
  <div id="admin-panel-view">
    <div class="admin-nav">
      <h3>Panel Administratora</h3>
      <div class="admin-nav-tabs">
        <button class="admin-tab active" onclick="switchAdminTab('stats')">Statystyki & Zużycie</button>
        <button class="admin-tab" onclick="switchAdminTab('chat')">Czat z klientami</button>
      </div>
      <button class="admin-tab" style="background:#ef4444" onclick="closeAdminPanel()">Wyjdź</button>
    </div>

    <div id="admin-tab-stats" class="admin-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div>Obciążenie strony</div>
          <div class="stat-value">12%</div>
        </div>
        <div class="stat-card">
          <div>Użytkownicy na stronie</div>
          <div class="stat-value">14</div>
        </div>
      </div>
      <div class="chart-container">
        <h4 style="margin-bottom: 15px; text-align: center;">Wykres Zużycia Strony (Ostatnie 24h)</h4>
        <canvas id="usageChart"></canvas>
      </div>
    </div>

    <div id="admin-tab-chat" class="admin-content" style="display: none; height: calc(100vh - 60px); padding: 10px;">
      <div class="discord-container">
        <div class="discord-sidebar">
          <div class="discord-sidebar-header">ZAMÓWIENIA KLIENTÓW</div>
          <div class="discord-user-list" id="discord-user-list"></div>
        </div>
        <div class="discord-chat-area">
          <div class="discord-empty" id="discord-empty">Kliknij na czat aby rozpocząć</div>
          <div class="discord-chat-content" id="discord-chat-content">
            <div class="discord-chat-header">
              <span id="discord-chat-header">Czat z użytkownikiem</span>
              <div>
                <button class="btn-admin-close" onclick="adminRequestClose()">Zakończ</button>
                <button class="btn-admin-emergency" onclick="adminEmergencyClose()">Zakończ awaryjnie</button>
              </div>
            </div>
            <div class="discord-messages" id="discord-messages"></div>
            <div class="discord-input-area">
              <input type="file" id="admin-file" accept="image/*" style="display:none" onchange="sendAdminImage(this)">
              <button class="btn-action" onclick="document.getElementById('admin-file').click()">📷</button>
              <input type="text" class="discord-input" id="discord-input" placeholder="Napisz odpowiedź do klienta..." onkeypress="handleDiscordKeyPress(event)">
              <button class="btn-action" onclick="sendAdminMessage()">&#10148;</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="zamowienia.js"></script>
</body>
</html>
