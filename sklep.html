<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dopasowane miniatury YouTube</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --text-color: #ffffff;
      --modal-bg: #1e293b;
      --input-bg: #0f172a;
      --border-color: #334155;
    }

    body.light-mode {
      --bg-color: #f8fafc;
      --text-color: #0f172a;
      --modal-bg: #ffffff;
      --input-bg: #f1f5f9;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: var(--bg-color);
      color: var(--text-color);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      position: relative;
      transition: background-color 0.3s ease, color 0.3s ease;
      overflow-x: hidden;
    }

    /* Przełącznik motywu w prawym górnym rogu */
    .theme-toggle-container {
      position: fixed;
      top: 15px;
      right: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 999;
    }

    .icon {
      font-size: 16px;
      user-select: none;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 48px;
      height: 28px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #334155;
      transition: background-color 0.3s ease;
      border-radius: 30px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 22px;
      width: 22px;
      left: 3px;
      bottom: 3px;
      background-color: #007aff;
      box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #e2e8f0;
    }

    input:checked + .slider:before {
      transform: translateX(20px);
      background-color: #38bdf8;
    }

    /* Dynamicznie skalowany mieniący się napis */
    .shiny-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      background: linear-gradient(90deg, #ff0055, #ff5000, #ffcc00, #00ffcc, #0099ff, #ff0055);
      background-size: 400% 400%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: colorShift 8s ease infinite, glow 2s ease-in-out infinite alternate;
      margin-bottom: 35px;
      padding: 0 10px;
      line-height: 1.2;
    }

    @keyframes colorShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    @keyframes glow {
      from { filter: drop-shadow(0 0 10px rgba(255, 0, 85, 0.4)); }
      to { filter: drop-shadow(0 0 25px rgba(0, 204, 255, 0.8)); }
    }

    .btn-next {
      background: #3b82f6;
      color: white;
      text-decoration: none;
      font-size: clamp(1rem, 3vw, 1.2rem);
      font-weight: 600;
      padding: 14px 32px;
      border-radius: 50px;
      box-shadow: 0 10px 25px rgba(59, 130, 246, 0.4);
      transition: all 0.3s ease;
      display: inline-block;
    }

    .btn-next:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 15px 30px rgba(59, 130, 246, 0.6);
      background: #2563eb;
    }

    .footer {
      position: absolute;
      bottom: 20px;
      font-size: 0.85rem;
    }

    .admin-link {
      color: #64748b;
      text-decoration: none;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .admin-link:hover {
      color: #38bdf8;
    }

    /* Okienko modalne dopasowane do urządzeń mobilnych */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10000;
      padding: 15px;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 25px;
      width: 100%;
      max-width: 320px;
      text-align: left;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transform: translateY(20px);
      transition: transform 0.3s ease;
      position: relative;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .close-btn {
      position: absolute;
      top: 15px; right: 20px;
      font-size: 1.4rem;
      color: #94a3b8;
      cursor: pointer;
      background: none;
      border: none;
    }

    .modal-title {
      font-size: 1.3rem;
      margin-bottom: 20px;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #94a3b8;
    }

    .form-group input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 0.95rem;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <div class="theme-toggle-container">
    <span class="icon">🌙</span>
    <label class="switch">
      <input type="checkbox" id="theme-toggle">
      <span class="slider"></span>
    </label>
    <span class="icon">☀️</span>
  </div>

  <h1 class="shiny-title">Dopasowane miniatury YouTube – kup teraz</h1>
  <a href="zamowienie.html" class="btn-next">Przejdź do zamówienia &rarr;</a>

  <div class="footer">
    <span class="admin-link" id="open-admin">Logowanie - Admin</span>
  </div>

  <div class="modal-overlay" id="admin-modal">
    <div class="modal-card">
      <button class="close-btn" id="close-admin">&times;</button>
      <h2 class="modal-title">Panel Admina</h2>
      <form id="login-form">
        <div class="form-group">
          <label for="admin-name">Nazwa</label>
          <input type="text" id="admin-name" placeholder="Wpisz nazwę" required>
        </div>
        <div class="form-group">
          <label for="admin-code">Kod</label>
          <input type="password" id="admin-code" placeholder="Wpisz kod" required>
        </div>
        <button type="submit" class="btn-submit">Zaloguj</button>
      </form>
    </div>
  </div>

  <script>
    // Wykrywanie typu urządzenia i dostosowywanie cech strony
    function detectDevice() {
      const width = window.innerWidth;
      const userAgent = navigator.userAgent.toLowerCase();
      let deviceType = "pc";

      if (/mobile|iphone|ipad|android/i.test(userAgent) || width <= 768) {
        deviceType = width <= 480 ? "phone" : "tablet";
      }

      document.body.setAttribute('data-device', deviceType);
    }

    window.addEventListener('resize', detectDevice);
    detectDevice();

    // Obsługa motywu
    const toggleSwitch = document.getElementById('theme-toggle');

    if (localStorage.getItem('theme') === 'light') {
      document.body.classList.add('light-mode');
      toggleSwitch.checked = true;
    }

    toggleSwitch.addEventListener('change', (e) => {
      if (e.target.checked) {
        document.body.classList.add('light-mode');
        localStorage.setItem('theme', 'light');
      } else {
        document.body.classList.remove('light-mode');
        localStorage.setItem('theme', 'dark');
      }
    });

    // Obsługa okienka Admina
    const adminLink = document.getElementById('open-admin');
    const adminModal = document.getElementById('admin-modal');
    const closeBtn = document.getElementById('close-admin');
    const loginForm = document.getElementById('login-form');

    adminLink.addEventListener('click', () => adminModal.classList.add('active'));
    closeBtn.addEventListener('click', () => adminModal.classList.remove('active'));
    adminModal.addEventListener('click', (e) => {
      if (e.target === adminModal) adminModal.classList.remove('active');
    });

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('admin-name').value;
      const code = document.getElementById('admin-code').value;

      if (name === 'admin' && code === '1234') {
        alert('Zalogowano pomyślnie!');
        adminModal.classList.remove('active');
      } else {
        alert('Błędna nazwa lub kod!');
      }
    });
  </script>
</body>
</html>
